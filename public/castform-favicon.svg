<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="castformWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="crispOutline" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#090e17" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Only Castform's Face & Cloud Head (Transparent Background) -->
  <g filter="url(#crispOutline)">
    <!-- Lower Cloud Lobes -->
    <circle cx="21" cy="50" r="11" fill="url(#castformWhite)" stroke="#94a3b8" stroke-width="1.2"/>
    <circle cx="43" cy="50" r="11" fill="url(#castformWhite)" stroke="#94a3b8" stroke-width="1.2"/>
    <circle cx="32" cy="48" r="10" fill="url(#castformWhite)"/>

    <!-- Head & Antenna Swirl -->
    <path d="M 32 3 C 37 10 40 16 36 21 C 46 24 51 32 51 40 C 51 50 43 55 32 55 C 21 55 13 50 13 40 C 13 32 18 24 28 21 C 24 16 27 10 32 3 Z" fill="url(#castformWhite)" stroke="#94a3b8" stroke-width="1.2"/>

    <!-- Antenna Swirl Line -->
    <path d="M 32 6 C 35 12 37 16 33.5 20" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Castform Grey Eye Mask (Goggle Shape) -->
    <path d="M 18 36 C 18 30 23.5 29 32 29 C 40.5 29 46 30 46 36 C 46 41.5 40.5 43.5 32 42 C 23.5 43.5 18 41.5 18 36 Z" fill="#94a3b8"/>

    <!-- Expressive Eyes -->
    <ellipse cx="25" cy="36" rx="4.5" ry="5.5" fill="#0f172a"/>
    <ellipse cx="39" cy="36" rx="4.5" ry="5.5" fill="#0f172a"/>

    <!-- Eye Highlights -->
    <circle cx="26.8" cy="34" r="1.8" fill="#ffffff"/>
    <circle cx="40.8" cy="34" r="1.8" fill="#ffffff"/>
    <circle cx="23.5" cy="38" r="1" fill="#ffffff"/>
    <circle cx="37.5" cy="38" r="1" fill="#ffffff"/>

    <!-- Cute Smile -->
    <path d="M 30 44.5 Q 32 46 34 44.5" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  </g>
</svg>
